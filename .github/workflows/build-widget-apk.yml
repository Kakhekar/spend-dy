name: Build Spend Diary Widget APK

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Live site URL. Leave blank to use https://<owner>.github.io/<repo>/"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  widget-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'spenddiary-ci-pass' }}
      BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'spenddiary-ci-pass' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Work out the site URL
        id: site
        env:
          SITE_INPUT: ${{ inputs.site_url }}
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ -n "$SITE_INPUT" ]; then
            URL="$SITE_INPUT"
          elif [ "${REPO,,}" = "$OWNER.github.io" ]; then
            URL="https://$OWNER.github.io/"
          else
            URL="https://$OWNER.github.io/$REPO/"
          fi
          if [[ "$URL" != https://* || "$URL" == *$'\n'* ]]; then
            echo "::error::The site URL must be a single HTTPS URL."
            exit 1
          fi
          case "$URL" in */) ;; *) URL="$URL/" ;; esac
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Site: $URL"

      - name: Wait for the site, manifest and icon to be live
        env:
          URL: ${{ steps.site.outputs.url }}
        run: |
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null "${URL}manifest.webmanifest" \
              && curl -fsS -o /dev/null "${URL}icons/icon-512.png" \
              && curl -fsS -o "$RUNNER_TEMP/app.js" "${URL}app.js" \
              && grep -q "SpendDiaryWidget.updateTotals" "$RUNNER_TEMP/app.js"; then
              echo "Site is live."; exit 0
            fi
            echo "Site or widget-enabled app.js is not live yet (attempt $i/20)..."; sleep 15
          done
          echo "::error::Could not load the site or widget-enabled app.js at ${URL}. Deploy the latest site before building the widget APK."
          exit 1

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p android-widget
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android-widget/android.keystore
          else
            keytool -genkeypair -v -keystore android-widget/android.keystore -alias android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" -keypass "$BUBBLEWRAP_KEY_PASSWORD" \
              -dname "CN=Spend Diary Widget, OU=Personal, O=Spend Diary, C=IN"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret found. Generated a throwaway key: later builds can't update this widget app (uninstall first)."
          fi

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools/latest"
          curl -fsSL -o "$RUNNER_TEMP/cmdtools.zip" https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$RUNNER_TEMP/cmdtools.zip" -d "$RUNNER_TEMP/cmdtools"
          cp -r "$RUNNER_TEMP/cmdtools/cmdline-tools/." "$SDK/cmdline-tools/latest/"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --install \
            "platform-tools" "platforms;android-36" "build-tools;35.0.0"
          test -f "$SDK/platforms/android-36/source.properties"
          test -f "$SDK/platforms/android-36/android.jar"
          test -f "$SDK/build-tools/35.0.0/source.properties"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --list_installed

      - name: Build native widget APK
        working-directory: android-widget
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android-widget/android.keystore
          SITE_URL: ${{ steps.site.outputs.url }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          gradle --no-daemon --stacktrace assembleRelease
          cp app/build/outputs/apk/release/app-release.apk SpendDiaryWidget.apk

      - name: Show the signing fingerprint
        working-directory: android-widget
        run: |
          {
            echo "### Spend Diary Widget APK built"
            echo ""
            echo "SHA-256 signing fingerprint:"
            echo '```'
            keytool -list -v -keystore android.keystore -alias android -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" | grep "SHA256:" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpendDiaryWidget-apk
          path: android-widget/SpendDiaryWidget.apk

      - name: Publish a GitHub Release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: widget-${{ github.run_number }}
          name: "Spend Diary Widget #${{ github.run_number }}"
          body: "Install SpendDiaryWidget.apk, then add the resizable Spend Diary widget from your Android home-screen widget picker. The widget APK stores entries locally and is separate from the synced TWA app."
          files: android-widget/SpendDiaryWidget.apk
